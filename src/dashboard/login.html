<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchyard — Access</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles-panels.css">
  <link rel="stylesheet" href="/styles-overlays.css">
  <link rel="stylesheet" href="/styles-mobile.css">
  <link rel="stylesheet" href="/styles-contexts.css">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg-base);
    }
    .login-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 32px 24px;
      width: 340px;
      max-width: 92vw;
      text-align: center;
    }
    @media (max-width: 640px) {
      .login-box { padding: 24px 16px; }
      .login-input { font-size: 20px; letter-spacing: 6px; padding: 14px; }
      .login-btn { padding: 12px; font-size: var(--font-size-base); }
    }
    .login-icon {
      display: block;
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
    }
    .login-logo {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .login-sub {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .login-label {
      display: block;
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 6px;
    }
    .login-input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 8px;
      text-align: center;
      padding: 12px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-input:focus {
      border-color: var(--text-secondary);
    }
    .login-input::placeholder {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--text-muted);
    }
    .login-btn {
      width: 100%;
      background: var(--bg-active);
      color: var(--text-bright);
      border: 1px solid var(--border-bright);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      font-weight: 600;
      letter-spacing: 1px;
      padding: 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 80ms;
    }
    .login-btn:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }
    .login-error {
      font-size: var(--font-size-xs);
      color: var(--danger);
      margin-top: 12px;
      min-height: 16px;
    }
    .login-hint {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img class="login-icon" src="/icon.svg" alt="" width="56" height="56">
    <div class="login-logo">SWITCHYARD</div>
    <form id="login-form">
      <label class="login-label" for="code-input">Access code</label>
      <input type="text" id="code-input" class="login-input"
             placeholder="------" maxlength="6" pattern="\d{6}"
             inputmode="numeric" autocomplete="off" autofocus>
      <button type="submit" class="login-btn">Open dashboard</button>
    </form>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">
      A new 6-digit code is made each time the server starts.<br>
      On this Mac: Switchyard menu bar icon &rsaquo; Copy dashboard access code.<br>
      If you started the server in a terminal, it is printed there.
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
